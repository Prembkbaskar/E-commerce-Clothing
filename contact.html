<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Cloth Store</title>
    
    <!-- Bootstrap and CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
    <link rel="icon" type="image/png" href="images/favicon.png">
    
    <style>
        /* Custom Styles */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #000080; /* Light background */
        }

    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <img src="images/logo.png" alt="Cloth Store"  width="55">
            <a class="navbar-brand" href="index.html">CLOTH STORE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="product.html">Shop</a></li>
                    <li class="nav-item"><a class="nav-link" href="product.html">Mens Collection</a></li>
                    <li class="nav-item"><a class="nav-link" href="product.html">Womens Collection</a></li>
                    <li class="nav-item"><a class="nav-link" href="product.html">Kids Collection</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html"><i class="bi bi-person-fill"></i></a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html"><i class="bi bi-cart-dash"></i></a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contact Section -->
<section class="contact-section">
    <div class="container">
        <div class="row align-items-center">
            <!-- Left Side - Image -->
            <div class="col-md-6 text-center">
                <img src="images/customercare.png" alt="Customer Support" class="img-fluid contact-image">
            </div>

            <!-- Right Side - Contact Form -->
            <div class="col-md-6">
                <div class="contact-form text-start p-4">
                    <h2 class="contact-title text-center">Contact Us</h2>
                    <p class="contact-subtitle text-center">We’d love to hear from you! Fill out the form below.</p>
                    <form>
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Name</label>
                            <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label fw-semibold">Message</label>
                            <textarea class="form-control" id="message" rows="4" placeholder="Write your message here..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>


    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-2 mt-6">
        <p>© 2025 Cloth Store. All rights reserved</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
