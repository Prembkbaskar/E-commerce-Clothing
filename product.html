<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Cloth Store</title>
    <!-- Bootstrap and CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">CLOTH STORE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Shop</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Product Section -->
    <section class="container py-5">
        <h2 class="text-center mb-4">Flash Sale</h2>
        <div class="row">
            <!-- Product 1 -->
            <div class="col-md-4">
                <div class="card">
                    <img src="images/product1.png" class="card-img-top" alt="T-Shirt">
                    <div class="card-body text-center">
                        <h5 class="card-title">T-Shirt</h5>
                        <p class="card-text">$30.00</p>
                        <a href="#" class="btn btn-success">Add to Cart</a>
                    </div>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="col-md-4">
                <div class="card">
                    <img src="images/product2.png" class="card-img-top" alt="Denim">
                    <div class="card-body text-center">
                        <h5 class="card-title">Denim</h5>
                        <p class="card-text">$50.00</p>
                        <a href="#" class="btn btn-success">Add to Cart</a>
                    </div>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="col-md-4">
                <div class="card">
                    <img src="images/product3.png" class="card-img-top" alt="Track">
                    <div class="card-body text-center">
                        <h5 class="card-title">Track</h5>
                        <p class="card-text">$15.00</p>
                        <a href="#" class="btn btn-success">Add to Cart</a>
                    </div>
                </div>
            </div>

            <!-- Product 4 -->
            <div class="col-md-4">
                <div class="card">
                    <img src="images/product4.png" class="card-img-top" alt="Sneakers">
                    <div class="card-body text-center">
                        <h5 class="card-title">Sneakers</h5>
                        <p class="card-text">$45.00</p>
                        <a href="#" class="btn btn-success">Add to Cart</a>
                    </div>
                </div>
            </div>

            <!-- Product 5 -->
            <div class="col-md-4">
                <div class="card">
                    <img src="images/product5.png" class="card-img-top" alt="Formals">
                    <div class="card-body text-center">
                        <h5 class="card-title">Formals</h5>
                        <p class="card-text">$40.00</p>
                        <a href="#" class="btn btn-success">Add to Cart</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-secondary text-white text-center py-3">
        <div class="container-footer">
            <p>&copy; 2025 Cloth Store. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
     <!--  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
