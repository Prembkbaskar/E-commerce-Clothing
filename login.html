<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloth Store</title>
    <!-- bootstrap and css -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <style>
        body {
            background-color: rgb(247, 248, 221); /* Light gray background */
            font-family: 'Poppins', sans-serif;
            background-image: url('images/women-collection.png');

        }
    </style>

    

</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <img src="images/logo.png" alt="Cloth Store"  width="55">
            <a class="navbar-brand" href="index.html">CLOTH STORE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="product.html">Shop</a></li>
                    <li class="nav-item"><a class="nav-link" href="product.html">Mens Collection</a></li>
                    <li class="nav-item"><a class="nav-link" href="product.html">Womens Collection</a></li>
                    <li class="nav-item"><a class="nav-link" href="product.html">Kids Collection</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html"><i class="bi bi-person-fill"></i></a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html"><i class="bi bi-cart-dash"></i></a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Login Form (Initially Visible) -->
    <div class="form-container center" id="loginForm">
        <h2 class="text-center">Login</h2>
        <form>
            <div class="mb-3">
                <label for="loginEmail" class="form-label">Email address</label>
                <input type="email" class="form-control" id="loginEmail" placeholder="Enter your email" required>
            </div>
            <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
            <p class="mt-3 text-center"><a href="#">Forgot password?</a></p>
            <p class="text-center">Don't have an account? <a href="#" onclick="showRegister()">Register</a></p>
        </form>
    </div>

    <!-- Registration Form (Initially Hidden) -->
    <div class="form-container" id="registerForm" style="display: none;">
        <h2 class="text-center">Register</h2>
        <form>
            <div class="mb-3">
                <label for="regName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="regName" placeholder="Enter your full name" required>
            </div>
            <div class="mb-3">
                <label for="regEmail" class="form-label">Email address</label>
                <input type="email" class="form-control" id="regEmail" placeholder="Enter your email" required>
            </div>
            <div class="mb-3">
                <label for="regPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="regPassword" placeholder="Enter your password" required>
            </div>
            <div class="mb-3">
                <label for="regConfirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="regConfirmPassword" placeholder="Confirm your password" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Register</button>
            <p class="mt-3 text-center">Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
        </form>
    </div>

     <!-- Footer -->
     <footer class="bg-dark text-white text-center py-2 mt-6">
        <p>© 2025 Cloth Store. All rights reserved</p>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


    <script>
        // Ensures Login Form is Always Shown First
        window.onload = function () {
            document.getElementById("loginForm").style.display = "block";
            document.getElementById("registerForm").style.display = "none";
        };

        function showRegister() {
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("registerForm").style.display = "block";
        }

        function showLogin() {
            document.getElementById("registerForm").style.display = "none";
            document.getElementById("loginForm").style.display = "block";
        }
        </script>

</body>
</html>
